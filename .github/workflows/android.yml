name: Build Android APKs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          (yes || true) | "$sdkmanager" --licenses >/dev/null
          "$sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" "ndk;30.0.16248370"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

      - name: Install Rust 1.99.1 and Android targets
        shell: bash
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android

      - name: Configure optional release signing
        if: github.event_name != 'pull_request'
        env:
          SHORTCUTS_KEYSTORE_BASE64: ${{ secrets.SHORTCUTS_KEYSTORE_BASE64 }}
          SHORTCUTS_STORE_PASSWORD: ${{ secrets.SHORTCUTS_STORE_PASSWORD }}
          SHORTCUTS_KEY_ALIAS: ${{ secrets.SHORTCUTS_KEY_ALIAS }}
          SHORTCUTS_KEY_PASSWORD: ${{ secrets.SHORTCUTS_KEY_PASSWORD }}
        run: python3 tools/ci-signing.py

      - name: Test and build
        run: |
          cargo test --manifest-path math-rust/Cargo.toml --locked
          ./gradlew --no-daemon :core:test :app:lintDebug :app:lintRelease :app:assembleDebug :app:assembleRelease

      - name: Collect APKs and checksums
        run: python3 tools/ci-artifacts.py

      - name: Upload APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Shortcuts-${{ github.run_number }}-apks
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Shortcuts-${{ github.run_number }}-reports
          path: |
            app/build/reports/lint-results-*.html
            core/build/reports/tests/test/
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove temporary signing data
        if: always() && github.event_name != 'pull_request'
        run: python3 tools/ci-signing.py --cleanup
